<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title><style>body{font-family:system-ui;max-width:640px;margin:2rem auto;padding:0 16px}textarea{width:100%;height:6rem}</style></head>
<body><h1>__TITLE__</h1><p>__PROBLEM__</p>
<form onsubmit="event.preventDefault();fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t.value})}).then(()=>location.reload())">
<textarea id="t" placeholder="Enter input..."></textarea><button>Submit</button></form>
<ul>{% for i in items %}<li><b>{{ i.analysis.summary }}</b> keywords: {{ i.analysis.keywords|join(', ') }}</li>{% endfor %}</ul></body></html>
